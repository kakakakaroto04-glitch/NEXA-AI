<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#06060b;color:#fff;min-height:100vh}body:before{content:"";position:fixed;inset:-30%;z-index:-2;background:radial-gradient(circle at 20% 20%,#8b2be244,transparent 25%),radial-gradient(circle at 80% 80%,#1687ff33,transparent 28%);animation:bg 10s infinite alternate}@keyframes bg{to{transform:scale(1.25) rotate(6deg)}}
.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px}.logo{font-weight:900;letter-spacing:4px;color:#c084fc;font-size:25px}.badge{font-size:12px;color:#aaa;border:1px solid #333;padding:7px 10px;border-radius:20px}.panel{background:#0e0e15dd;border:1px solid #292936;border-radius:22px;backdrop-filter:blur(12px);box-shadow:0 15px 60px #0008}.chat{height:62vh;min-height:420px;overflow:auto;padding:18px}.msg{max-width:82%;padding:13px 15px;margin:10px 0;border-radius:16px;line-height:1.5;animation:in .25s ease;white-space:pre-wrap}.bot{background:#18131f;border:1px solid #34213f}.user{margin-left:auto;background:#7138a6}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.typing{color:#aaa}.controls{display:flex;gap:10px;padding:14px;border-top:1px solid #292936}.input{flex:1;background:#08080d;color:#fff;border:1px solid #333;border-radius:14px;padding:14px;outline:none}.input:focus{border-color:#a855f7}button{border:0;border-radius:14px;padding:0 18px;background:#8b3fd1;color:#fff;font-weight:bold;cursor:pointer}button:hover{filter:brightness(1.15);transform:translateY(-1px)}.quick{display:flex;gap:8px;overflow:auto;padding:12px}.quick button{padding:9px 12px;white-space:nowrap;background:#15151e;border:1px solid #333;font-weight:normal}.info{padding:18px 0;color:#aaa;font-size:13px}.status{padding:0 18px 12px;color:#8f8;font-size:12px}.settings{display:flex;gap:8px;padding:0 14px 12px}.settings input{flex:1;background:#08080d;color:#aaa;border:1px solid #333;border-radius:10px;padding:9px;font-size:12px}
</style></head>
<body><div class="app"><div class="top"><div class="logo">NEXA</div><div class="badge" id="badge">GENERATIVE • V2</div></div>
<div class="panel"><div class="chat" id="chat"><div class="msg bot">Olá! Eu sou a <b>NEXA</b> 🧠⚡<br>Agora estou preparada para conversar usando um modelo generativo através de um backend seguro.</div></div>
<div class="quick"><button onclick="ask('Explique Jujutsu Kaisen')">Jujutsu</button><button onclick="ask('Explique Blue Lock')">Blue Lock</button><button onclick="ask('Me ensine Python do zero')">Python</button><button onclick="ask('O que você consegue fazer?')">Ajuda</button></div>
<div class="controls"><input id="input" class="input" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">ENVIAR</button></div></div>
<div class="settings"><input id="apiUrl" placeholder="URL do backend (ex.: https://seu-backend.com/api/chat)"><button onclick="saveUrl()">SALVAR</button></div>
<div class="status" id="status">Backend não configurado.</div><div class="info">NEXA V2 • As respostas são geradas por IA no backend. A chave secreta nunca fica dentro do APK.</div></div>
<script>
const KEY='nexa_api_url';let history=[];const input=document.getElementById('input'),chat=document.getElementById('chat'),status=document.getElementById('status'),apiUrl=document.getElementById('apiUrl');
apiUrl.value=localStorage.getItem(KEY)||'';updateStatus();
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function saveUrl(){localStorage.setItem(KEY,apiUrl.value.trim());updateStatus()}
function updateStatus(){status.textContent=apiUrl.value.trim()?'Backend configurado.':'Backend não configurado.';status.style.color=apiUrl.value.trim()?'#8f8':'#aaa'}
async function send(){const v=input.value.trim();if(!v)return;const url=apiUrl.value.trim();add(v,'user');input.value='';if(!url){add('Configure a URL do backend abaixo para eu poder gerar respostas de verdade.','bot');return}history.push({role:'user',content:v});const t=add('Pensando...','bot');t.classList.add('typing');try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const answer=data.output||data.response||data.message||'Não recebi uma resposta válida do servidor.';t.textContent=answer;t.classList.remove('typing');history.push({role:'assistant',content:answer})}catch(e){t.textContent='Não consegui conectar ao backend. Verifique a URL e se o servidor está online.';t.classList.remove('typing');history.pop();console.error(e)}}
function ask(v){input.value=v;send()}
</script></body></html>
